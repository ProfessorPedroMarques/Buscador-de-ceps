<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Do CEP ao destino: endereços no mapa e a melhor rota de ônibus municipal, metrò, trem, avião ou carro — com links reais de compra de passagens."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7f3ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />
    <meta property="og:title" content="Buscador de CEP — Sua viagem começa aqui" />
    <meta
      property="og:description"
      content="Digite o CEP, veja o endereço no mapa e descubra a rota ideal: ônibus, metrò, trem, avião ou carro, com passagens reais."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%AB%3C/text%3E%3C/svg%3E"
    />
    <title>Buscador de CEP — Sua viagem começa aqui ✈️</title>

    <script>
      /* Aplica o tema salvo (ou o do sistema) ANTES da primeira pintura,
         evitando o "flash" de tema errado ao carregar. */
      ;(function () {
        var salvo = null
        try {
          salvo = localStorage.getItem('cep:tema')
        } catch (e) {}
        var sistema = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        document.documentElement.dataset.theme = salvo || sistema
      })()
    </script>

    <style>
      /* Splash de carregamento (CSS crítico embutido) — some quando o React monta.
         Funções CSS usadas aqui: min(), calc(), conic-gradient(),
         radial-gradient(), rgb(), hsl() e env(). */
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      }
      #root:empty {
        min-height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            900px 480px at 88% -12%,
            rgb(3 105 161 / 0.09),
            transparent 60%
          ),
          #e7f3ff;
      }
      html[data-theme='dark'] #root:empty {
        background:
          radial-gradient(
            900px 480px at 88% -12%,
            rgb(56 189 248 / 0.09),
            transparent 60%
          ),
          #0b1220;
      }
      #root:empty::before {
        content: '';
        width: min(42px, 12vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background: conic-gradient(from 0deg, hsl(204 97% 48%), transparent 70%);
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 4px),
          #000 0
        );
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
        animation: girar 0.8s linear infinite;
      }
      html[data-theme='dark'] #root:empty::before {
        background: conic-gradient(from 0deg, hsl(199 93% 59%), transparent 70%);
      }
      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }
      noscript {
        display: grid;
        place-items: center;
        min-height: 60vh;
        font: 600 0.95rem/1.6 'Segoe UI', system-ui, sans-serif;
        color: #d92d20;
        text-align: center;
        padding: 0 max(20px, env(safe-area-inset-right, 0px));
      }
      /* Mensagem exibida se o app não conseguir montar (evita o
         carregamento infinito quando o servidor não está de pé). */
      .boot-erro {
        font: 500 0.95rem/1.6 'Segoe UI', system-ui, sans-serif;
        text-align: center;
        padding: 24px 20px;
        max-width: 36rem;
        margin: 0 auto;
      }
      .boot-erro h2 {
        margin: 0 0 6px;
        font-size: 1.15rem;
        color: #d92d20;
      }
      .boot-erro code {
        background: rgb(0 0 0 / 0.07);
        padding: 2px 6px;
        border-radius: 6px;
      }
      html[data-theme='dark'] .boot-erro code {
        background: rgb(255 255 255 / 0.12);
      }
      .boot-erro ul {
        margin: 12px 0 0;
        padding-left: 20px;
        text-align: left;
      }
      .boot-erro a {
        color: #4f46e5;
      }
      html[data-theme='dark'] .boot-erro a {
        color: #a5b4fc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript> Ative o JavaScript para usar o Buscador de CEP. 📮 </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
