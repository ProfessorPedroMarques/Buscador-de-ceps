<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Consulte endereços brasileiros por CEP e visualize no mapa."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f1a" />
    <meta property="og:title" content="Buscador de CEP" />
    <meta
      property="og:description"
      content="Digite o CEP e localize o endereço no mapa."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%AE%3C/text%3E%3C/svg%3E"
    />
    <title>Buscador de CEP</title>

    <script>
      /* Aplica o tema salvo (ou o do sistema) ANTES da primeira pintura,
         evitando o "flash" de tema errado ao carregar. */
      ;(function () {
        var salvo = null
        try {
          salvo = localStorage.getItem('cep:tema')
        } catch (e) {}
        var sistema = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        document.documentElement.dataset.theme = salvo || sistema
      })()
    </script>

    <style>
      /* Splash de carregamento (CSS crítico embutido) — some quando o React monta.
         Funções CSS usadas aqui: min(), calc(), conic-gradient(),
         radial-gradient(), rgb(), hsl() e env(). */
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      }
      #root:empty {
        min-height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            900px 480px at 88% -12%,
            rgb(79 70 229 / 0.09),
            transparent 60%
          ),
          #eef1f7;
      }
      html[data-theme='dark'] #root:empty {
        background:
          radial-gradient(
            900px 480px at 88% -12%,
            rgb(129 140 248 / 0.08),
            transparent 60%
          ),
          #0b0f1a;
      }
      #root:empty::before {
        content: '';
        width: min(42px, 12vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background: conic-gradient(from 0deg, hsl(243 75% 59%), transparent 70%);
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 4px),
          #000 0
        );
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
        animation: girar 0.8s linear infinite;
      }
      html[data-theme='dark'] #root:empty::before {
        background: conic-gradient(from 0deg, hsl(234 89% 74%), transparent 70%);
      }
      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }
      noscript {
        display: grid;
        place-items: center;
        min-height: 60vh;
        font: 600 0.95rem/1.6 'Segoe UI', system-ui, sans-serif;
        color: #d92d20;
        text-align: center;
        padding: 0 max(20px, env(safe-area-inset-right, 0px));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript> Ative o JavaScript para usar o Buscador de CEP. 📮 </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
